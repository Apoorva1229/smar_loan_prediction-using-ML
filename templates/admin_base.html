
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin · LoanWise{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>

<body>

<aside class="sidebar">

    <a class="admin-brand" href="{{ url_for('admin_dashboard') }}">
        LoanWise<span>.</span>
        <small>ADMIN PANEL</small>
    </a>

    <nav>
        <a href="{{ url_for('admin_dashboard') }}">Overview</a>
        <a href="{{ url_for('manage_users') }}">Users</a>
        <a href="{{ url_for('admin_predictions') }}">Loan Applications</a>
        <a href="{{ url_for('reports') }}">Reports</a>
    </nav>

    <div class="side-bottom">

        <span>Admin: {{ session.get('admin_username') }}</span>

        <form method="POST" action="{{ url_for('admin_logout') }}">
            <button>Log Out</button>
        </form>

    </div>

</aside>

<main class="admin-main">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

</body>
</html>
