
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · LoanWise</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>

<body class="login-page">

<section class="admin-login">

    <a class="admin-brand" href="{{ url_for('home') }}">
        LoanWise<span>.</span>
        <small>ADMIN ACCESS</small>
    </a>

    <h1>Administrator Sign In</h1>

    <p>Access the LoanWise management dashboard.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button>Sign In to Admin</button>

    </form>

    <a class="back-link" href="{{ url_for('home') }}">
        ← Back to Website
    </a>

</section>

</body>
</html>
