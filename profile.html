
{% extends "base.html" %}

{% block title %}Profile · SmartLoan{% endblock %}

{% block content %}

<p class="kicker">ACCOUNT</p>

<h1>Your profile</h1>

<div class="tile profile">

    <p>
        <span>Full name</span>
        <strong>{{ user.name }}</strong>
    </p>

    <p>
        <span>Email</span>
        <strong>{{ user.email }}</strong>
    </p>

    <p>
        <span>Joined</span>
        <strong>{{ user.created_at }}</strong>
    </p>

</div>

{% endblock %}
