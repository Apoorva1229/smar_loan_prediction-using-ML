
{% extends "base.html" %}

{% block title %}Register · SmartLoan{% endblock %}

{% block content %}

<div class="auth">

    <p class="kicker">JOIN LOANWISE</p>

    <h1>Create your account</h1>

    <form method="POST" action="{{ url_for('register') }}">

        <label>Full Name</label>

        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            maxlength="100"
            required
            autocomplete="name"
        >

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            maxlength="254"
            required
            autocomplete="email"
        >

        <label>Password (at least 8 characters)</label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            minlength="8"
            required
            autocomplete="new-password"
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            minlength="8"
            required
            autocomplete="new-password"
        >

        <button type="submit" class="btn full">
            Register
        </button>

    </form>

    <p class="muted">
        Already registered?
        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
